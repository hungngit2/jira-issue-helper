name: 'Jira Ticket Transition and Environment Info'
description: 'Fetches Jira ticket release information and updates the environment table in the ticket.'
inputs:
  JIRA_BASE_URL:
    description: 'Jira base URL, e.g. https://your-domain.atlassian.net'
    required: true
  JIRA_USER_EMAIL:
    description: 'Jira user email, e.g. yourname@your-domain'
    required: true
  JIRA_API_TOKEN:
    description: 'Jira API token'
    required: true
  JIRA_ISSUE_KEY:
    description: 'Jira issue key, e.g. ABC-1234'
    required: true
  JIRA_ENV_COLUMNS:
    description: 'Comma separated columns for environment table, e.g. Environment,Branch,Path to Build,Path to Upsert'
    required: false
  JIRA_ISSUE_KEY_PATTERN:
    description: 'Default: ([A-Z0-9]+)[\\s-]?(\\d+)'
    required: false
  JIRA_ISSUE_TYPE_TRANSITION:
    description: 'Default: "Story:Code Review;Bug:Code Revieww"'
    required: false
  JIRA_COMMENT_BODY:
    description: 'Comment body to add to the Jira issue'
    required: false
  LINEAR_API_TOKEN:
    description: 'Linear API token. When set, Linear is tried first before falling back to Jira.'
    required: false
  LINEAR_ISSUE_KEY:
    description: 'Linear issue identifier, e.g. ENG-123. Defaults to JIRA_ISSUE_KEY if not set.'
    required: false
  LINEAR_COMMENT_BODY:
    description: 'Comment body to add to the Linear issue (falls back to JIRA_COMMENT_BODY if not set)'
    required: false
  ISSUE_TRACKER:
    description: 'Explicit tracker selection: "linear" or "jira". Omit to auto-detect (Linear if LINEAR_API_TOKEN is set, else Jira). When Linear is selected but the issue is not found, the action always falls back to Jira.'
    required: false
  ACTIONS_MODE:
    description: 'Mode of action to perform: "NewComment", "Transition", or "IssueInfo"'
    required: false
runs:
  using: node24
  main: 'dist/index.js'